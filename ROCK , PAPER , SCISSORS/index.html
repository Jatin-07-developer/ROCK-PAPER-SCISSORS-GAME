<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSORS GAME</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h1>ROCK PAPER SCISSORS</h1>
    </div>
    <div class="content">
        <div class="choice"> <img width="150" height="150px" src="images/rock.png"> </div>
        <div class="choice"> <img width="150" height="150px" src="images/paper.png"> </div>
        <div class="choice"> <img width="150" height="150px" src="images/scissor.png"> </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0 </p> 
            <p>You</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>

    </div>
    
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
